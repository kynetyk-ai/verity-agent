name: ci

# Minimal gate: lint + type-check + test. Runs on **merges/pushes to the long-lived branches**
# (`main`, `develop`) and on **PRs targeting them**, so a feature branch is gated through its PR
# rather than on every push. Calls uv directly — no `just` in CI (the justfile is the local dev
# shortcut). Kept small: the offline suite needs no Docker or API key (the `@docker` / `@live` tests
# auto-skip), and `uv sync` omits the `sandbox` extra so the Deep Agents tests `importorskip`.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
