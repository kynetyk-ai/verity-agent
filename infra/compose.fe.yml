# Fully containerized feature-engineering run (ROADMAP 7.4, Part D).
#
# Brings up the GENERIC control plane as a container; configured through its API (the fe_run
# entrypoint), it launches ephemeral sandbox + code-runner WORKER containers as *siblings* on the
# host daemon via the mounted /var/run/docker.sock (the controlled, audited socket of ADR 0003 §f —
# not docker-in-docker). The agent workers reach the host's local model at host.docker.internal.
#
#   Prereqs: build the images and have the dataset + a local model server (e.g. ollama):
#     docker build -f Dockerfile.sandbox       -t verity-sandbox:latest .
#     docker build -f Dockerfile.controlplane  -t verity-controlplane:latest .
#   Run (one-shot):
#     mkdir -p /tmp/verity-staging
#     docker compose -f infra/compose.fe.yml run --rm controlplane
#   or:  just fe-containerized
#
# The shared staging dir is bind-mounted at an IDENTICAL host<->container path so the worker bind
# mounts (created by the CP container, resolved by the host daemon) line up — see DockerBackend
# staging_root / VERITY_WORKER_STAGING.
services:
  controlplane:
    image: verity-controlplane:latest
    build:
      context: ..
      dockerfile: Dockerfile.controlplane
    environment:
      VERITY_MODEL: "${VERITY_MODEL:-qwen3.6:27b-coding-mxfp8}"
      VERITY_LOCAL_BASE_URL: "${VERITY_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}"
      VERITY_MAX_CYCLES: "${VERITY_MAX_CYCLES:-2}"
      VERITY_PER_CLASS: "${VERITY_PER_CLASS:-150}"
      VERITY_RESERVED_FRACTION: "${VERITY_RESERVED_FRACTION:-0.5}"
      VERITY_SANDBOX_IMAGE: "verity-sandbox:latest"
      VERITY_FE_DATASET: "/data/train.csv"
      VERITY_WORKER_STAGING: "/tmp/verity-staging"
    volumes:
      # The controlled host socket — the CP launches sibling workers through it (ADR 0003 §f).
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared staging at an identical path so worker bind-mount sources resolve on the host daemon.
      - /tmp/verity-staging:/tmp/verity-staging
      # The dataset, read-only. (Gitignored; present on the host under feature-engineering-test/.)
      - ../feature-engineering-test/train.csv:/data/train.csv:ro
