[project]
name = "verity"
version = "0.0.0"
description = "Implementation of the Self-Revising Discovery Harness (verity = truth + verify)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.107.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
sandbox = [
    "deepagents>=0.6.8,<0.7",
    "langchain-openai>=0.2",
    "pypdf>=4",  # the read_pdf sandbox tool (5.4); baked into the sandbox image
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.155.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The Deep Agents sandbox driver imports an untyped third-party stack; it is quarantined to one
# module (src/verity/sandbox/deepagents_driver.py) and the framework-neutral core stays strict-typed.
[[tool.mypy.overrides]]
module = ["deepagents.*", "langchain.*", "langchain_core.*", "langchain_openai.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "docker: integration test requiring a reachable Docker daemon (auto-skipped when absent)",
    "live: integration test requiring a live model API key (auto-skipped when absent)",
]
