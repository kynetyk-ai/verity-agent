[project]
name = "verity"
version = "0.0.0"
description = "Implementation of the Self-Revising Discovery Harness (verity = truth + verify)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.107.1",
    "structlog>=24.1",
]

# Deployment-side CLI: reap orphaned workers by label (ROADMAP 7.4.h / ADR 0003 e). Talks only to a
# WorkerBackend, so it needs no service/domain deps.
[project.scripts]
verity = "verity.service.cli:main"
verity-reaper = "verity.provisioning.reaper:main"

# Plugin loaders (ROADMAP 9.3, ADR 0004 (i) / 0006): task & verifier types are DISCOVERED from these
# entry-point groups at boot, not compiled into a hardcoded registry — a new type is added by
# installing a package that advertises an entry point, with no control-plane rebuild. Each entry
# point resolves to a `register(registry)` callable. The built-ins are dogfooded here (they flow
# through the same loader); the core `verity` distribution's entries load first so they keep priority.
# NOTE: entry points come from INSTALLED dist metadata — run `uv sync` after editing these.
[project.entry-points."verity.task_types"]
fe-kaggle = "verity.composition.fe_kaggle:register"
fe-holdout = "verity.composition.fe_holdout:register"
code = "verity.composition.code:register"

[project.entry-points."verity.verifier_types"]
fake = "verity.domains.fake:register_verifier"
fe-kaggle = "verity.verifier.fe_kaggle_service:register_verifier"
holdout-experiment = "verity.verifier.holdout_service:register_verifier"

[project.optional-dependencies]
sandbox = [
    "deepagents>=0.6.8,<0.7",
    "langchain-openai>=0.2",
    "pypdf>=4",  # the read_pdf sandbox tool (5.4); baked into the sandbox image
]
# The networked-transport deps (Phase 7.2): the verifier / control-plane service images install this,
# while the lean core and the loopback path never import them. FastAPI hosts the port server, httpx
# is the client, uvicorn serves the ASGI app.
service = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
# Metrics emission (Phase 7.3): a service exposes a Prometheus scrape over the RunReport signals.
# Opt-in — the lean core stays metrics-free (the default sink is a no-op).
telemetry = [
    "prometheus-client>=0.20",
]
# The Kaggle client (fe-kaggle task): the real-leaderboard final-test gate submits + reads the public
# score through it. Baked into the control-plane image; the lean core imports it only lazily (the
# `RealKaggleScorer`), so the offline suite + CI never need it.
kaggle = [
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.155.2",
]
notebook = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "pandas>=3.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools", "experiments"]
# Recorded agent submissions (verbatim model output kept as run artifacts, not maintained source)
# and the exploratory run-data analysis notebook (a throwaway analysis artifact, not library code).
extend-exclude = [
    "prototyping_datasci_test/prototyping-runs",
    "prototyping_datasci_test/code-runner-calibration",
    "prototyping_datasci_test/run_data_explorer.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The Deep Agents sandbox driver imports an untyped third-party stack; it is quarantined to one
# module (src/verity/sandbox/deepagents_driver.py) and the framework-neutral core stays strict-typed.
# pypdf is a lazy import inside the read_pdf sandbox tool; it lives only in the `sandbox` extra, so a
# CI type-check without that extra (mypy src) must tolerate it being absent.
[[tool.mypy.overrides]]
module = [
    "deepagents.*", "langchain.*", "langchain_core.*", "langchain_openai.*", "langgraph.*",
    "pypdf.*",
    # The `service` extra (Phase 7.2 transport): absent in CI's `mypy src`, so tolerate them missing.
    "fastapi.*", "uvicorn.*", "httpx.*", "starlette.*",
    # The `telemetry` extra (Phase 7.3): lazy Prometheus import, absent in CI's `mypy src`.
    "prometheus_client.*",
    # The `kaggle` extra (fe-kaggle): lazy import in RealKaggleScorer, absent in CI's `mypy src`.
    "kaggle.*",
]
ignore_missing_imports = true

# FastAPI's route decorators: without the `service` extra installed (CI's lean `mypy src`) they
# resolve to Any, and strict mode rejects an untyped decorator. The framework is the type authority,
# so relax just this check for the FastAPI-hosting modules (the transport loopback seam + the
# control-service HTTP surface). Their non-route logic stays strict-typed.
[[tool.mypy.overrides]]
module = ["verity.transport.http", "verity.service.http"]
disallow_untyped_decorators = false

# Without the `sandbox` extra installed (CI's `mypy src`), AgentMiddleware resolves to Any, and
# strict mode forbids subclassing Any. The framework is the type authority here, so relax just this
# one check for the quarantined driver; with the extra installed the real base class still applies.
[[tool.mypy.overrides]]
module = ["verity.sandbox.deepagents_driver"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "docker: integration test requiring a reachable Docker daemon (auto-skipped when absent)",
    "live: integration test requiring a live model API key (auto-skipped when absent)",
    "kaggle: integration test requiring Kaggle creds + the `kaggle` client (auto-skipped when absent)",
]
