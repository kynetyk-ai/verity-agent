[project]
name = "verity"
version = "0.0.0"
description = "Implementation of the Self-Revising Discovery Harness (verity = truth + verify)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.107.1",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.155.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
